services:
  api:
    build: .
    command: python -m services.api
    env_file:
      - path: .env
        required: false
    environment:
      API_HOST: 0.0.0.0
      PORT: ${PORT:-8080}
      ARC_LOG_DIR: /app/logs
      FRONTEND_DIR: /frontend
      ENABLE_LIVE_CHAIN: ${ENABLE_LIVE_CHAIN:-0}
      SNAPSHOT_CACHE_SECONDS: ${SNAPSHOT_CACHE_SECONDS:-60}
      API_SNAPSHOT_RESPONSE_CACHE_SECONDS: ${API_SNAPSHOT_RESPONSE_CACHE_SECONDS:-60}
      API_SOCKET_TIMEOUT_SECONDS: ${API_SOCKET_TIMEOUT_SECONDS:-5}
      API_RATE_LIMIT_SNAPSHOT_PER_10S: ${API_RATE_LIMIT_SNAPSHOT_PER_10S:-80}
      API_RATE_LIMIT_ACCOUNT_PER_10S: ${API_RATE_LIMIT_ACCOUNT_PER_10S:-30}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-1}
      VECLIB_MAXIMUM_THREADS: ${VECLIB_MAXIMUM_THREADS:-1}
      UPSTREAM_RELAYER_PATH: /app/upstream/py-builder-relayer-client
      IBKR_HOST: host.docker.internal
      IBKR_CLIENT_ID: ${IBKR_API_CLIENT_ID:-4210}
      IBKR_CP_BASE_URL: ${IBKR_DOCKER_CP_BASE_URL:-https://host.docker.internal:5055/v1/api}
      IBKR_ENERGY_HISTORY_CSV: ${IBKR_DOCKER_ENERGY_HISTORY_CSV:-/brent_strategy_data/ibkr_energy_history.csv}
      IBKR_FORECAST_PROXY_PRICE_SOURCES: ${IBKR_DOCKER_FORECAST_PROXY_PRICE_SOURCES:-yahoo}
      PUBLIC_HEDGE_PRICE_SOURCES: ${PUBLIC_DOCKER_HEDGE_PRICE_SOURCES:-yahoo}
      PUBLIC_HEDGE_QUOTE_TIMEOUT: ${PUBLIC_DOCKER_HEDGE_QUOTE_TIMEOUT:-2}
      KALSHI_DIRECT_EVENT_MAX_PAGES: ${KALSHI_DOCKER_DIRECT_EVENT_MAX_PAGES:-1}
      KALSHI_EVENT_TIMEOUT: ${KALSHI_DOCKER_EVENT_TIMEOUT:-1.5}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs
      - ../frontend:/frontend:ro
      - ${UPSTREAM_RELAYER_PATH:-../../py-builder-relayer-client}:/app/upstream/py-builder-relayer-client:ro
      - ${IBKR_ENERGY_HISTORY_DATA_DIR:-../../brent_strategy/improm_signal/data}:/brent_strategy_data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: python -m services.worker --interval ${WORKER_INTERVAL_SECONDS:-300}
    env_file:
      - path: .env
        required: false
    environment:
      ARC_LOG_DIR: /app/logs
      FRONTEND_DIR: /frontend
      ENABLE_LIVE_CHAIN: ${ENABLE_LIVE_CHAIN:-0}
      WORKER_LIVE_CHAIN: ${WORKER_LIVE_CHAIN:-0}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-300}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-1}
      VECLIB_MAXIMUM_THREADS: ${VECLIB_MAXIMUM_THREADS:-1}
      UPSTREAM_RELAYER_PATH: /app/upstream/py-builder-relayer-client
      IBKR_HOST: host.docker.internal
      IBKR_CLIENT_ID: ${IBKR_WORKER_CLIENT_ID:-4220}
      IBKR_CP_BASE_URL: ${IBKR_DOCKER_CP_BASE_URL:-https://host.docker.internal:5055/v1/api}
      IBKR_ENERGY_HISTORY_CSV: ${IBKR_DOCKER_ENERGY_HISTORY_CSV:-/brent_strategy_data/ibkr_energy_history.csv}
      IBKR_FORECAST_PROXY_PRICE_SOURCES: ${IBKR_DOCKER_FORECAST_PROXY_PRICE_SOURCES:-yahoo}
      PUBLIC_HEDGE_PRICE_SOURCES: ${PUBLIC_DOCKER_HEDGE_PRICE_SOURCES:-yahoo}
      PUBLIC_HEDGE_QUOTE_TIMEOUT: ${PUBLIC_DOCKER_HEDGE_QUOTE_TIMEOUT:-2}
      KALSHI_DIRECT_EVENT_MAX_PAGES: ${KALSHI_DOCKER_DIRECT_EVENT_MAX_PAGES:-1}
      KALSHI_EVENT_TIMEOUT: ${KALSHI_DOCKER_EVENT_TIMEOUT:-1.5}
    volumes:
      - ./logs:/app/logs
      - ../frontend:/frontend:ro
      - ${UPSTREAM_RELAYER_PATH:-../../py-builder-relayer-client}:/app/upstream/py-builder-relayer-client:ro
      - ${IBKR_ENERGY_HISTORY_DATA_DIR:-../../brent_strategy/improm_signal/data}:/brent_strategy_data:ro
    restart: unless-stopped

  telegram:
    profiles: ["telegram"]
    build: .
    command: python -m integrations.telegram_bot
    env_file:
      - path: .env
        required: false
    environment:
      ARC_LOG_DIR: /app/logs
      FRONTEND_DIR: /frontend
      ENABLE_LIVE_CHAIN: ${ENABLE_LIVE_CHAIN:-0}
      UPSTREAM_RELAYER_PATH: /app/upstream/py-builder-relayer-client
      IBKR_HOST: host.docker.internal
      IBKR_CLIENT_ID: ${IBKR_TELEGRAM_CLIENT_ID:-4230}
      IBKR_CP_BASE_URL: ${IBKR_DOCKER_CP_BASE_URL:-https://host.docker.internal:5055/v1/api}
      IBKR_ENERGY_HISTORY_CSV: ${IBKR_DOCKER_ENERGY_HISTORY_CSV:-/brent_strategy_data/ibkr_energy_history.csv}
      IBKR_FORECAST_PROXY_PRICE_SOURCES: ${IBKR_DOCKER_FORECAST_PROXY_PRICE_SOURCES:-yahoo}
      PUBLIC_HEDGE_PRICE_SOURCES: ${PUBLIC_DOCKER_HEDGE_PRICE_SOURCES:-yahoo}
      PUBLIC_HEDGE_QUOTE_TIMEOUT: ${PUBLIC_DOCKER_HEDGE_QUOTE_TIMEOUT:-2}
      KALSHI_DIRECT_EVENT_MAX_PAGES: ${KALSHI_DOCKER_DIRECT_EVENT_MAX_PAGES:-1}
      KALSHI_EVENT_TIMEOUT: ${KALSHI_DOCKER_EVENT_TIMEOUT:-1.5}
    volumes:
      - ./logs:/app/logs
      - ../frontend:/frontend:ro
      - ${UPSTREAM_RELAYER_PATH:-../../py-builder-relayer-client}:/app/upstream/py-builder-relayer-client:ro
      - ${IBKR_ENERGY_HISTORY_DATA_DIR:-../../brent_strategy/improm_signal/data}:/brent_strategy_data:ro
    restart: unless-stopped

name: starter-kit-check

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  arc-oss-builder-starter-kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arc-oss-builder-starter-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: arc-oss-builder-starter-kit/package-lock.json
      - run: node --version
      - run: npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify
      - run: npm audit --omit=dev
